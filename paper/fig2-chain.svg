<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" role="img" aria-label="Attack chain: a broadcast BSSID leads to deriving the Wi-Fi password, which branches into decrypting video and standing up a rogue access point, which leads to a spoofed OTA prompt and unsigned firmware push.">
  <defs>
    <marker id="ah2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#000"/>
    </marker>
  </defs>

  <rect x="210" y="6" width="220" height="50" fill="none" stroke="#000" stroke-width="1.1"/>
  <text x="320" y="27" text-anchor="middle" font-family="Liberation Serif, serif" font-size="11" font-weight="bold">802.11 beacon frame</text>
  <text x="320" y="42" text-anchor="middle" font-family="Liberation Serif, serif" font-size="9.5">BSSID &#8212; public, passive read</text>

  <line x1="320" y1="56" x2="320" y2="86" stroke="#000" stroke-width="1.2" marker-end="url(#ah2)"/>

  <rect x="190" y="88" width="260" height="54" fill="none" stroke="#000" stroke-width="2.2"/>
  <text x="320" y="109" text-anchor="middle" font-family="Liberation Serif, serif" font-size="11" font-weight="bold">CVE-2026-81640</text>
  <text x="320" y="124" text-anchor="middle" font-family="Liberation Serif, serif" font-size="9.5">Derive WPA2 pre-shared key from BSSID</text>

  <line x1="258" y1="142" x2="160" y2="180" stroke="#000" stroke-width="1.2" marker-end="url(#ah2)"/>
  <text x="180" y="162" text-anchor="middle" font-family="Liberation Serif, serif" font-size="9">decrypt capture</text>

  <line x1="382" y1="142" x2="470" y2="180" stroke="#000" stroke-width="1.2" marker-end="url(#ah2)"/>
  <text x="460" y="162" text-anchor="middle" font-family="Liberation Serif, serif" font-size="9">stand up matching AP</text>

  <rect x="20" y="184" width="270" height="62" fill="none" stroke="#000" stroke-width="1.1"/>
  <text x="155" y="205" text-anchor="middle" font-family="Liberation Serif, serif" font-size="11" font-weight="bold">CVE-2026-81330</text>
  <text x="155" y="220" text-anchor="middle" font-family="Liberation Serif, serif" font-size="9.5">Decrypt and reassemble video</text>
  <text x="155" y="234" text-anchor="middle" font-family="Liberation Serif, serif" font-size="9" font-style="italic">no interaction required</text>

  <rect x="350" y="184" width="270" height="62" fill="none" stroke="#000" stroke-width="1.1"/>
  <text x="485" y="205" text-anchor="middle" font-family="Liberation Serif, serif" font-size="11" font-weight="bold">CVE-2026-82563</text>
  <text x="485" y="220" text-anchor="middle" font-family="Liberation Serif, serif" font-size="9.5">Rogue AP accepted as the device</text>
  <text x="485" y="234" text-anchor="middle" font-family="Liberation Serif, serif" font-size="9" font-style="italic">full MitM position</text>

  <line x1="485" y1="246" x2="485" y2="282" stroke="#000" stroke-width="1.2" marker-end="url(#ah2)"/>
  <text x="565" y="268" text-anchor="middle" font-family="Liberation Serif, serif" font-size="9">serve fake ota_device_version</text>

  <rect x="330" y="284" width="270" height="76" fill="none" stroke="#000" stroke-width="2.2"/>
  <text x="465" y="306" text-anchor="middle" font-family="Liberation Serif, serif" font-size="11" font-weight="bold">CVE-2026-77974</text>
  <text x="465" y="321" text-anchor="middle" font-family="Liberation Serif, serif" font-size="9.5">Spoofed status leads to OTA prompt,</text>
  <text x="465" y="335" text-anchor="middle" font-family="Liberation Serif, serif" font-size="9.5">unsigned firmware accepted</text>
  <text x="465" y="350" text-anchor="middle" font-family="Liberation Serif, serif" font-size="9" font-style="italic">one user tap</text>
</svg>
