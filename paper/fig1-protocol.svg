<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" aria-label="The C6 camera and the EarVision app exchange three flows over two UDP ports on a device-hosted access point, none encrypted, authenticated, or signed.">
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#000"/>
    </marker>
  </defs>
  <rect x="20" y="16" width="180" height="56" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="110" y="40" text-anchor="middle" font-family="Liberation Serif, serif" font-size="12" font-weight="bold">Softish C6</text>
  <text x="110" y="56" text-anchor="middle" font-family="Liberation Serif, serif" font-size="10.5">AP + camera</text>

  <rect x="440" y="16" width="180" height="56" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="530" y="40" text-anchor="middle" font-family="Liberation Serif, serif" font-size="12" font-weight="bold">EarVision app</text>
  <text x="530" y="56" text-anchor="middle" font-family="Liberation Serif, serif" font-size="10.5">Android phone</text>

  <line x1="200" y1="44" x2="440" y2="44" stroke="#000" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="320" y="36" text-anchor="middle" font-family="Liberation Serif, serif" font-size="9.5">802.11 softAP, WPA2-PSK (derived)</text>

  <rect x="16" y="96" width="608" height="112" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="5 4"/>

  <line x1="440" y1="120" x2="212" y2="120" stroke="#000" stroke-width="1.2" marker-end="url(#ah)"/>
  <text x="326" y="114" text-anchor="middle" font-family="Liberation Serif, serif" font-size="9.5">UDP/61500 &#8212; opcodes 10 01/02/03/04</text>

  <line x1="212" y1="154" x2="440" y2="154" stroke="#000" stroke-width="1.2" marker-end="url(#ah)"/>
  <text x="326" y="148" text-anchor="middle" font-family="Liberation Serif, serif" font-size="9.5">UDP/61500 &#8212; JSON status + WEBP frames</text>

  <line x1="212" y1="188" x2="440" y2="188" stroke="#000" stroke-width="1.2" marker-end="url(#ah)"/>
  <text x="326" y="182" text-anchor="middle" font-family="Liberation Serif, serif" font-size="9.5">UDP/61501 &#8212; JPEG video frames</text>

  <text x="326" y="202" text-anchor="middle" font-family="Liberation Serif, serif" font-size="9.5" font-weight="bold">no TLS &#183; no authentication &#183; no signing</text>
</svg>
